   <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot, increment, updateDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCCqjSW3VFwgkGVhazlGkGdEMrU0XGRGUg",
    authDomain: "earn-pro-app.firebaseapp.com",
    projectId: "earn-pro-app",
    storageBucket: "earn-pro-app.firebasestorage.app",
    messagingSenderId: "261020578492",
    appId: "1:261020578492:web:3dfc719a876d03ae9896b9",
    measurementId: "G-29KFG1XYTX"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;

  // Login Function
  window.login = async function() {
    const provider = new GoogleAuthProvider();
    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      console.error("Login failed:", error.message);
      alert("Login failed. Check your Firebase settings.");
    }
  };

  // Auth & Database Listener
  onAuthStateChanged(auth, async (user) => {
    document.getElementById('splash').style.display = 'none';
    if (user) {
      currentUser = user;
      document.getElementById("user").innerText = user.displayName;
     
      const userRef = doc(db, "users", user.uid);
      const userDoc = await getDoc(userRef);

      if (!userDoc.exists()) {
        await setDoc(userRef, { name: user.displayName, balance: 0, access: false });
      }

      onSnapshot(userRef, (snap) => {
        const data = snap.data();
        if (data && data.access) {
          document.getElementById("lockscreen").style.display = "none";
          document.getElementById("app").style.display = "block";
          document.getElementById("balance").innerText = "N" + data.balance;
        } else {
          document.getElementById("lockscreen").style.display = "block";
          document.getElementById("app").style.display = "none";
        }
      });
    }
  });

  // Payment Function
  window.submitPayment = async function() {
    if (!currentUser) return alert("Login first");
    let refText = document.getElementById("ref").value;
    if (!refText) return alert("Enter reference");
    try {
      await addDoc(collection(db, "payments"), {
        uid: currentUser.uid,
        name: currentUser.displayName,
        ref: refText,
        status: "pending",
        timestamp: new Date()
      });
      document.getElementById("status").innerText = "Waiting For Approval";
    } catch (e) { console.error(e); }
  };

  // Earn Function
  window.earn = async function() {
    if (!currentUser) return;
    await updateDoc(doc(db, "users", currentUser.uid), {
      balance: increment(500)
    });
  };



     </script>
